<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student ID Card</title>

  <!-- Do NOT edit this HTML file. Write all your CSS in style.css -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= STUDENT ID CARD ================= -->
  <div class="card">

    <!-- Header strip: university name -->
    <div class="card-header">
      <h1 class="university">Universiti Malaysia Sarawak</h1>
      <p class="card-type">Student Identity Card</p>
    </div>

    <!-- Main area: photo on the left, details on the right -->
    <div class="card-body">
      <!-- Put your own photo named photo.jpg in the same folder -->
      <img class="photo" src="arashpic.JPG" alt="Student photo">

      <div class="details">
        <h2 class="name">Arashveer Singh</h2>
        <p><span class="label">Student ID:</span> 103399</p>
        <p><span class="label">Program:</span> Bachelor of Cognitive Science</p>
        <p><span class="label">Valid until:</span> July 2027</p>
      </div>
    </div>

    <!-- Footer -->
    <div class="card-footer">
      <p>If found, please return to the Student Affairs Office.</p>
    </div>

  </div>
  <!-- =================================================== -->


  <!--
    BONUS TASK (flip card): only for students who finish early.
    Replace the whole card above with this structure, then use
    CSS 3D Transforms so the card flips to show the back on hover.

    <div class="card">
      <div class="card-inner">

        <div class="card-front">
          ... copy the card-header, card-body and card-footer here ...
        </div>

        <div class="card-back">
          <h3>Emergency Contact</h3>
          <p>Phone: 012-345 6789</p>
          <p>Blood group: O+</p>
          <p>Library No: L-2026-0451</p>
        </div>

      </div>
    </div>
  -->

</body>
</html>
